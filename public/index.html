<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>신촌 코스어 페스타</title>

  <meta
    name="description"
    content="신촌 코스어 페스타 참가자 찾기"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="page">

    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">

      <div class="brand-area">

        <img
          src="/images/logo.png"
          alt="신촌 코스어 페스타"
          class="logo"
          onerror="this.style.display='none'"
        >

        <div class="event-date">
          <strong>2026. 09. 26–27</strong>
          <span>SAT · SUN</span>
        </div>

        <div class="event-location">
          신촌 스타광장　|　창천문화공원　|　U-PLEX 신촌점
        </div>

      </div>

      <button
        class="write-button"
        id="openWriteModal"
        type="button"
      >
        게시물 적기
      </button>

    </header>

      <!-- ================================
           PARTICIPANT FINDER
      ================================= -->

      <section class="finder">

        <div class="section-heading">

          <div>


            <h2>
              참가자 찾기
              <span id="postCount">0명</span>
            </h2>

          </div>

        </div>



        <!-- CATEGORY + SEARCH -->

        <div class="filter-row">

          <div
            class="filter-group"
            id="categoryFilters"
          >

            <button
              class="pill active"
              data-filter="all"
              type="button"
            >
              전체
            </button>

            <button
              class="pill"
              data-filter="코스어"
              type="button"
            >
              코스어
            </button>

            <button
              class="pill"
              data-filter="카메라"
              type="button"
            >
              카메라
            </button>

            <button
              class="pill"
              data-filter="일반"
              type="button"
            >
              일반
            </button>

          </div>


          <label class="search-box">

            <span>⌕</span>

            <input
              id="searchInput"
              type="search"
              placeholder="장르 / 캐릭터 검색"
            >

          </label>

        </div>



        <!-- DAY FILTER -->

        <div class="day-tabs">

          <button
            class="day-tab active"
            data-day="26"
            type="button"
          >
            <strong>26</strong>
            <span>SAT</span>
          </button>


          <button
            class="day-tab"
            data-day="27"
            type="button"
          >
            <strong>27</strong>
            <span>SUN</span>
          </button>

        </div>



        <!-- PARTICIPANT POSTS -->

        <div
          class="posts-grid"
          id="postsContainer"
        >

          <div class="loading">
            참가자 정보를 불러오는 중...
          </div>

        </div>

      </section>

    </main>



    <!-- ================================
         WRITE MODAL
    ================================= -->

    <div
      class="modal"
      id="writeModal"
      aria-hidden="true"
    >

      <div class="modal-background"></div>


      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >

        <!-- CLOSE -->

        <button
          class="close-button"
          id="closeWriteModal"
          type="button"
          aria-label="닫기"
        >
          ×
        </button>



        <!-- MODAL TITLE -->

        <div class="modal-title">


          <h2 id="modalTitle">
            내 게시물 적기
          </h2>

          <p>
            행사에서 만날 사람들에게
            내 정보를 알려주세요!
          </p>

        </div>



        <!-- ================================
             FORM
        ================================= -->

        <form id="postForm">


          <!-- 닉네임 -->

          <div class="form-group">

            <label for="nickname">
              닉네임 <span>*</span>
            </label>

            <input
              id="nickname"
              type="text"
              maxlength="20"
              placeholder="ex. 신춘자"
              required
            >

          </div>



          <!-- X ACCOUNT -->

          <div class="form-group">

            <label for="xAccount">
              X 계정
            </label>

            <div class="prefix-input">

              <span>@</span>

              <input
                id="xAccount"
                type="text"
                maxlength="30"
                placeholder="본인 아이디"
              >

            </div>

          </div>



          <!-- CATEGORY -->

          <div class="form-group">

            <label>
              참여 방식 <span>*</span>
            </label>

            <div class="choice-group">

              <label class="choice">

                <input
                  type="radio"
                  name="category"
                  value="코스어"
                  required
                >

                <span>
                  코스어
                </span>

              </label>


              <label class="choice">

                <input
                  type="radio"
                  name="category"
                  value="카메라"
                >

                <span>
                  카메라
                </span>

              </label>


              <label class="choice">

                <input
                  type="radio"
                  name="category"
                  value="일반"
                >

                <span>
                  일반
                </span>

              </label>

            </div>

          </div>



          <!-- ================================
               DATE + TIME
          ================================= -->

          <div class="form-group">

            <label>
              오는 날짜 / 시간 <span>*</span>
            </label>


            <div class="day-time-grid">


              <!-- 26 SAT -->

              <div class="day-time-row">

                <label class="day-time-check">

                  <input
                    type="checkbox"
                    name="days"
                    value="26"
                  >

                  <span>
                    26 SAT
                  </span>

                </label>


                <input
                  id="time26"
                  type="time"
                  disabled
                  aria-label="26일 오는 시간"
                >

              </div>



              <!-- 27 SUN -->

              <div class="day-time-row">

                <label class="day-time-check">

                  <input
                    type="checkbox"
                    name="days"
                    value="27"
                  >

                  <span>
                    27 SUN
                  </span>

                </label>


                <input
                  id="time27"
                  type="time"
                  disabled
                  aria-label="27일 오는 시간"
                >

              </div>


            </div>


            <p class="help-text">
              오는 날짜를 선택하고
              도착 예정 시간을 입력해주세요.
            </p>

          </div>



          <!-- GENRE -->

          <div class="form-group">

            <label for="genre">
              장르 / 캐릭터
            </label>

            <input
              id="genre"
              type="text"
              maxlength="80"
              placeholder="ex. 애니명 / 캐릭터"
            >

          </div>



          <!-- MESSAGE -->

          <div class="form-group">

            <label for="message">
              한마디
            </label>

            <textarea
              id="message"
              maxlength="120"
              placeholder="ex. 같이 사진 찍어요!"
            ></textarea>

          </div>



          <!-- IMAGE -->

          <div class="form-group">

            <label>
              착장 / 참고 이미지
            </label>


            <label
              class="image-upload"
              for="imageFile"
            >

              <strong>
                ＋
              </strong>

              <span>
                이미지를 선택해주세요
              </span>

              <small>
                JPG / PNG / WEBP · 최대 5MB
              </small>

            </label>


            <input
              id="imageFile"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              hidden
            >


            <div
              class="image-preview"
              id="imagePreview"
            ></div>

          </div>



          <!-- ================================
               DELETE PASSWORD
          ================================= -->

          <div class="form-group">

            <label for="deletePassword">
              삭제 비밀번호 <span>*</span>
            </label>


            <input
              id="deletePassword"
              type="password"
              inputmode="numeric"
              autocomplete="new-password"
              pattern="[0-9]{4}"
              maxlength="4"
              minlength="4"
              placeholder="숫자 4자리"
              required
            >


            <p class="help-text">
              게시물 삭제 시 필요한 번호입니다.
              꼭 기억해주세요!
            </p>

          </div>



          <!-- SUBMIT -->

          <button
            class="submit-button"
            id="submitButton"
            type="submit"
          >
            게시물 등록하기
          </button>


          <p
            class="form-status"
            id="formStatus"
          ></p>


        </form>

      </div>

    </div>

  </div>


  <!-- SCRIPT -->

  <script src="/script.js"></script>

</body>
</html>
